name: Gather leads

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: Campaign YAML path or DB id
        default: config/campaigns/example_retail_islamabad.yaml
      max_companies:
        description: Companies to process this run
        default: "60"
      commit_results:
        description: Commit CSVs into leads/ (otherwise artifacts only)
        type: boolean
        default: true
      user_id:
        description: Supabase user ID (resolves per-user API keys from DB)
        default: ""
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC (08:00 PKT)

concurrency:
  # Per campaign, not global. Two campaigns share nothing - separate rows, separate
  # leads/<campaign>/ output - but one group meant dispatching three at once left
  # GitHub cancelling the queued ones, so two of the three silently never ran and sat
  # wedged at "starting" instead. Same campaign twice still queues, which is the case
  # that genuinely conflicts.
  group: gather-leads-${{ github.event.inputs.campaign || 'config/campaigns/example_retail_islamabad.yaml' }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CAMPAIGN: ${{ github.event.inputs.campaign || 'config/campaigns/example_retail_islamabad.yaml' }}
      MAX_COMPANIES: ${{ github.event.inputs.max_companies || '60' }}
      COMMIT_RESULTS: ${{ github.event.inputs.commit_results || 'true' }}
      USER_ID: ${{ github.event.inputs.user_id || '' }}
      # Infrastructure secrets (shared, repo-level)
      GTM_DATABASE_URL: ${{ secrets.GTM_DATABASE_URL }}
      GTM_ENCRYPTION_KEY: ${{ secrets.GTM_ENCRYPTION_KEY }}
      # Operator-level API keys (fallback when no per-user key in DB).
      # On grydinteam these are absent – users bring their own via the Settings UI.
      GTM_BRAVE_API_KEY: ${{ secrets.GTM_BRAVE_API_KEY }}
      GTM_HUNTER_API_KEY: ${{ secrets.GTM_HUNTER_API_KEY }}
      GTM_GROQ_API_KEY: ${{ secrets.GTM_GROQ_API_KEY }}
      GTM_GOOGLE_PLACES_API_KEY: ${{ secrets.GTM_GOOGLE_PLACES_API_KEY }}
      GTM_SHEETS_CREDENTIALS_JSON: ${{ secrets.GTM_SHEETS_CREDENTIALS_JSON }}
      GTM_SHEETS_SPREADSHEET_ID: ${{ secrets.GTM_SHEETS_SPREADSHEET_ID }}
      GTM_GITHUB_READ_TOKEN: ${{ secrets.GTM_GITHUB_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[api,overture,sheets]"

      # Resolve per-user API keys from Supabase (encrypted at rest).
      # Overwrites any repo-level key secrets with the user's own keys.
      # On Hasee10 (no user_id) this is a no-op and repo secrets are used.
      - name: Resolve user API keys
        if: env.USER_ID != ''
        run: python scripts/resolve_user_keys.py "$USER_ID"

      # Local geocode cache only (dedupe/suppression state now lives in Postgres).
      - name: Restore geocode cache
        uses: actions/cache/restore@v4
        with:
          path: data/geocode_cache.json
          key: gtm-geocode-${{ github.run_id }}
          restore-keys: gtm-geocode-

      - name: Run campaign
        run: python -m gtm_engine.cli run "$CAMPAIGN" --max-companies "$MAX_COMPANIES"

      - name: Mirror qualified leads to Google Sheets (when configured)
        if: env.GTM_SHEETS_SPREADSHEET_ID != ''
        run: |
          campaign_id=$(python -m gtm_engine.cli campaign-id "$CAMPAIGN")
          python -m gtm_engine.cli sheets "$campaign_id" || echo "sheets export failed (non-fatal)"

      - name: Save geocode cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/geocode_cache.json
          key: gtm-geocode-${{ github.run_id }}

      - name: Upload CSVs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_number }}
          path: data/exports/*.csv
          retention-days: 90

      - name: Commit results into leads/
        if: env.COMMIT_RESULTS == 'true' && github.repository == 'Hasee10/qualifyr'
        run: |
          campaign_id=$(python -m gtm_engine.cli campaign-id "$CAMPAIGN")
          mkdir -p "leads/$campaign_id"
          cp data/exports/*_qualified.csv "leads/$campaign_id/"
          cp data/exports/*_all.csv "leads/$campaign_id/"
          # Keep a stable "latest" pointer so downstream tools have a fixed path.
          cp "$(ls -t data/exports/*_qualified.csv | head -1)" "leads/$campaign_id/latest_qualified.csv"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leads
          git diff --cached --quiet && echo "no new leads" && exit 0
          git commit -m "leads: $campaign_id run ${{ github.run_number }} [skip ci]"
          # The branch moves under us. A crawl takes minutes, during which another
          # campaign's run commits its own leads and ordinary development gets pushed,
          # so a bare push fails non-fast-forward and reds the job *after* the pipeline
          # already succeeded - losing the CSVs for a reason unrelated to the run.
          # Each run writes only leads/<its own campaign>/, so rebasing is safe.
          #
          # Retry generously with growing backoff: a burst of pushes (a dev pushing several
          # commits while the crawl runs) can lose several races in a row, and three quick
          # tries over ~15s is not enough to outlast it. Six tries with a widening gap ride
          # out a burst without ever failing a run whose real work already succeeded.
          for attempt in 1 2 3 4 5 6; do
            git fetch origin "$GITHUB_REF_NAME" || true
            # Replay our leads commit onto the latest ref. latest_qualified.csv is a
            # whole-file "latest pointer" that every run of this campaign rewrites, so back-
            # to-back runs always collide on exactly that file - a plain rebase then stops
            # with a conflict and leaves unmerged files, which no number of retries can clear.
            # Our run owns that pointer (it is the newest export), so -X theirs makes the
            # commit being replayed (ours) win the colliding hunk; the unique timestamped
            # CSVs never conflict. Any other failure (a genuine race) aborts the half-done
            # rebase so the next attempt starts from a clean tree instead of deadlocking.
            if git rebase -X theirs "origin/$GITHUB_REF_NAME" && git push; then
              echo "leads pushed on attempt $attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push attempt $attempt failed, retrying in $((attempt * 4))s"
            sleep $((attempt * 4))
          done
          echo "could not push leads after 6 attempts" >&2
          exit 1

      # Beyond GitHub's default failure email: open (or comment on) a tracking issue so a failed
      # scheduled crawl is visible in the repo, not just in one person's inbox. Keyless - uses
      # the built-in GITHUB_TOKEN.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAMPAIGN_REF: ${{ github.event.inputs.campaign || 'scheduled run' }}
        run: |
          body="gather-leads failed for **${CAMPAIGN_REF}**.
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing=$(gh issue list --state open --label crawl-failure --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "gather-leads run failed" --label crawl-failure --body "$body" \
              || gh issue create --title "gather-leads run failed" --body "$body"
          fi
